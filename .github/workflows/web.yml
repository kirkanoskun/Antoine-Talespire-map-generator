name: Website

# Builds the static site (scripts/build-web.sh), runs every test (Go, the
# engine in its real WebAssembly runtime, the browser journey), publishes the
# site to Cloudflare Workers on every push to main, then checks the live site
# serves that build and rolls back if it does not. See docs/site-web.md for the
# one-time Cloudflare setup and for going back to an earlier version.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Version à publier : laisser vide pour la dernière, ou coller un commit / une étiquette pour revenir en arrière"
        required: false
        default: ""

# One deployment at a time, in order.
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty: the commit that triggered the run. Set by hand to publish an
          # earlier version again (docs/site-web.md, "Revenir en arrière").
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the whole engine
        # Nothing is published from a commit whose tests fail.
        run: go vet ./... && go test ./...
      - name: Build the site
        run: scripts/build-web.sh
      - name: Test the engine in its WebAssembly runtime
        # Go's wasm_exec refuses an environment over ~12 kB, hence env -i.
        run: |
          env -i PATH="$PATH:$(go env GOROOT)/lib/wasm" HOME="$HOME" \
            GOCACHE="$(go env GOCACHE)" GOMODCACHE="$(go env GOMODCACHE)" \
            GOOS=js GOARCH=wasm go test ./cmd/web/ ./internal/catalogs/
      - name: Test the site in a real browser
        # Versions published before these checks existed have no e2e folder.
        if: hashFiles('e2e/run.js') != ''
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node run.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-screenshots
          path: e2e/shots
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/web
          retention-days: 14

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      # The public address, to check the site after publishing. Override with a
      # repository variable; set it to "none" to skip the check.
      SITE_URL: ${{ vars.SITE_URL || 'https://cartographe.antoinedebaets.com' }}
    steps:
      - uses: actions/checkout@v4 # for wrangler.jsonc and scripts/check-site.sh
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist/web
      - name: Cloudflare not configured yet
        if: env.CONFIGURED != 'true'
        run: echo "::notice::Site built but not deployed — add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (docs/site-web.md)."
      - uses: actions/setup-node@v4
        if: env.CONFIGURED == 'true'
        with:
          node-version: 22
      - name: Deploy to Cloudflare Workers
        if: env.CONFIGURED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Creates the Worker on first run, updates it afterwards; the custom
        # domain attached in the dashboard is kept across deploys.
        run: npx --yes wrangler@4 deploy
      - name: Check the live site serves this build
        id: live
        if: env.CONFIGURED == 'true' && env.SITE_URL != 'none'
        run: scripts/check-site.sh "$SITE_URL" dist/web
      - name: Roll back to the previous version
        # The new version did not come up as built: put the previous one back,
        # and leave this run red so the failure is seen.
        if: failure() && steps.live.conclusion == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 rollback --yes --message "Automatic rollback - the live check failed for ${GITHUB_SHA::7}"
